services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: selenne-db
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    volumes:
      - sqldata:/var/opt/mssql
    ports:
      - "1433:1433"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SA_PASSWORD}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selenne-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SelenneDB;User ID=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;"
      Jwt__SecretKey: "${JWT_SECRET}"
      AppSettings__BaseUrl: "${BACKEND_URL}"
      Cors__AllowedOrigins__0: "${FRONTEND_URL}"
    ports:
      - "5000:8080"
    volumes:
      - uploads:/app/wwwroot/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../../Selenne_Boutique/selenne-fixed
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${BACKEND_URL}"
    container_name: selenne-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqldata:
  uploads:
